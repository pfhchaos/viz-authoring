[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viz-authoring"
version = "0.1.0"
description = "Framework for building audio-reactive Wayland wallpaper visualizations — generic GPU/worker/load primitives extracted from flame-sheep"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "moderngl>=5.0",
    "vulkan",
    "cffi",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Optional dev/debug conveniences in gpu_context: PNG snapshot (Pillow) and the
# PyOpenGL GL fallback path. Neither is needed for normal operation.
debug = ["Pillow", "PyOpenGL"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Generic demo/utility shaders that stayed after the flame renderer moved out
# to flame_sheep (triangle = swapchain validation, blur = gaussian).
viz_authoring = ["vk/shaders/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mirrors the root monorepo pyproject.toml's pytest config (see its
# [tool.pytest.ini_options] comment) so this package's test suite is
# self-sufficient when run standalone — from its own rootdir, outside the
# monorepo — ahead of the 0.9 repo split. --import-mode=importlib avoids
# the cwd-shadow footgun where a stray same-named directory on sys.path
# masks the installed package.
addopts = "--tb=short -m 'not slow' --import-mode=importlib --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
